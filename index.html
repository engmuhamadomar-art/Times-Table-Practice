<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Times Table Practice</title>
    <!-- html2canvas for taking evidence screenshots -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --correct-color: #16a34a;
            --correct-bg: #dcfce7;
            --incorrect-color: #dc2626;
            --incorrect-bg: #fee2e2;
            --border-color: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        header.app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        header.app-header h1 {
            font-size: 2.2rem;
            color: var(--primary-dark);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header.app-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 6px;
            font-weight: 500;
        }

        /* -------------------------------------------------------------
           SCREEN 1: SETUP SCREEN
        ------------------------------------------------------------- */
        .setup-card {
            background: var(--card-bg);
            padding: 36px 32px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 480px;
            text-align: center;
            margin-top: 20px;
            animation: fadeIn 0.3s ease-out;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            margin-bottom: 24px;
        }

        .form-group label {
            font-weight: 700;
            font-size: 1rem;
            color: #334155;
        }

        .form-group input[type="text"] {
            padding: 14px 16px;
            font-size: 1.15rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            user-select: text;
            -webkit-user-select: text;
            background: #f8fafc;
        }

        .form-group input[type="text"]:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }

        .options-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .option-btn {
            padding: 14px 8px;
            background: #f8fafc;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .option-btn span.sub {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .option-btn.selected {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .option-btn.selected span.sub {
            color: var(--primary);
        }

        .btn-start {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-start:hover {
            background: var(--primary-dark);
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: var(--incorrect-color);
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: -12px;
            margin-bottom: 16px;
            display: none;
        }

        /* -------------------------------------------------------------
           SCREEN 2: PRACTICE WORKSPACE
        ------------------------------------------------------------- */
        .quiz-container {
            display: none;
            width: 100%;
            max-width: 920px;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.3s ease-out;
        }

        .quiz-container.active {
            display: flex;
        }

        /* Capturable Evidence Box */
        #capture-area {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 18px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .student-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .student-name-tag {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .practice-tag {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-badge {
            font-size: 1.3rem;
            font-weight: 800;
            padding: 8px 22px;
            border-radius: 30px;
            background: #f8fafc;
            border: 2px solid var(--border-color);
            display: none;
        }

        .score-badge.visible {
            display: block;
        }

        /* Dynamic Feedback Banner */
        .feedback-banner {
            display: none;
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.45;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .feedback-banner.show {
            display: block;
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .feedback-banner.perfect {
            background: var(--correct-bg);
            color: #15803d;
            border: 2px solid #86efac;
        }

        .feedback-banner.great {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: 2px solid #93c5fd;
        }

        .feedback-banner.retry {
            background: #fff7ed;
            color: #c2410c;
            border: 2px solid #fdba74;
        }

        /* Questions Grid */
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .q-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            font-size: 1.25rem;
            font-weight: 800;
            transition: all 0.2s ease;
        }

        .q-number {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-right: 6px;
            font-weight: 700;
        }

        .q-expression {
            color: #1e293b;
            letter-spacing: 0.5px;
        }

        .q-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .q-input {
            width: 70px;
            height: 44px;
            text-align: center;
            font-size: 1.35rem;
            font-weight: 800;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: #ffffff;
            color: var(--primary-dark);
            outline: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .q-input.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
            background: var(--primary-light);
        }

        .q-mark {
            font-size: 1.4rem;
            font-weight: 900;
            width: 26px;
            text-align: center;
        }

        .q-mark.tick { color: var(--correct-color); }
        .q-mark.cross { color: var(--incorrect-color); }

        /* -------------------------------------------------------------
           NATURAL IN-FLOW TOUCH NUMBER PAD (NO OVERLAP)
        ------------------------------------------------------------- */
        .numpad-container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .np-btn {
            padding: 14px;
            font-size: 1.4rem;
            font-weight: 800;
            background: #f8fafc;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: background 0.1s, transform 0.1s;
            text-align: center;
            touch-action: manipulation;
        }

        .np-btn:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }

        .np-btn.action-bs {
            background: #fee2e2;
            color: #991b1b;
            border-color: #fca5a5;
        }

        .np-btn.action-next {
            background: #dbeafe;
            color: #1e40af;
            border-color: #93c5fd;
            font-size: 1.1rem;
        }

        /* Bottom Control Action Bar */
        .actions-bar {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn-action {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .btn-action:active { transform: scale(0.96); }

        .btn-check {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-check:hover { background: var(--primary-dark); }

        .btn-evidence {
            background: var(--correct-color);
            color: white;
            display: none;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .btn-evidence:hover { background: #15803d; }

        .btn-restart {
            background: #64748b;
            color: white;
            display: none;
        }

        .btn-restart:hover { background: #475569; }

        /* Keyframe Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 600px) {
            body { padding: 14px 10px; }
            .setup-card { padding: 24px 18px; }
            #capture-area { padding: 18px 14px; }
            .questions-grid { grid-template-columns: 1fr 1fr; }
            .q-card { padding: 8px 10px; font-size: 1.1rem; }
            .q-input { width: 58px; height: 38px; font-size: 1.15rem; }
            .btn-action { width: 100%; text-align: center; }
            .actions-bar { justify-content: center; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <h1>✏️ Times Table Practice</h1>
    <p>Stage 5 Mathematics — Master Your Multiplication Tables</p>
</header>

<!-- ===================================================================
     SCREEN 1: SETUP FORM
=================================================================== -->
<div class="setup-card" id="screen-setup">
    <div class="form-group">
        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter your full name..." autocomplete="off" spellcheck="false">
    </div>
    <div class="error-msg" id="nameError">Please enter your name to start!</div>

    <div class="form-group">
        <label>Select Practice Length:</label>
        <div class="options-group">
            <button type="button" class="option-btn selected" onclick="selectCount(15, this)">
                15 Qs
                <span class="sub">Quick Check</span>
            </button>
            <button type="button" class="option-btn" onclick="selectCount(30, this)">
                30 Qs
                <span class="sub">Standard</span>
            </button>
            <button type="button" class="option-btn" onclick="selectCount(50, this)">
                50 Qs
                <span class="sub">Challenge</span>
            </button>
        </div>
    </div>

    <button type="button" class="btn-start" onclick="startPractice()">Start Practice</button>
</div>

<!-- ===================================================================
     SCREEN 2: PRACTICE WORKSPACE
=================================================================== -->
<div class="quiz-container" id="screen-quiz">
    
    <!-- Capturable Evidence Area -->
    <div id="capture-area">
        <div class="quiz-header">
            <div class="student-info">
                <div class="student-name-tag" id="displayName">Student Name</div>
                <div class="practice-tag" id="displayModeTag">15 Questions Test</div>
            </div>
            <div class="score-badge" id="scoreBadge">Score: 0 / 15</div>
        </div>

        <div class="feedback-banner" id="feedbackBanner"></div>

        <div class="questions-grid" id="questionsGrid">
            <!-- Questions injected here -->
        </div>
    </div>

    <!-- TOUCH NUMBER PAD (Planted naturally in document flow - no fixed sticky overlaps) -->
    <div class="numpad-container" id="numpad">
        <div class="numpad-grid">
            <button type="button" class="np-btn" onclick="pressNum('1')">1</button>
            <button type="button" class="np-btn" onclick="pressNum('2')">2</button>
            <button type="button" class="np-btn" onclick="pressNum('3')">3</button>
            <button type="button" class="np-btn" onclick="pressNum('4')">4</button>
            <button type="button" class="np-btn" onclick="pressNum('5')">5</button>
            <button type="button" class="np-btn" onclick="pressNum('6')">6</button>
            <button type="button" class="np-btn" onclick="pressNum('7')">7</button>
            <button type="button" class="np-btn" onclick="pressNum('8')">8</button>
            <button type="button" class="np-btn" onclick="pressNum('9')">9</button>
            <button type="button" class="np-btn action-bs" onclick="pressBackspace()">⌫</button>
            <button type="button" class="np-btn" onclick="pressNum('0')">0</button>
            <button type="button" class="np-btn action-next" onclick="focusNextInput()">Next ➔</button>
        </div>
    </div>

    <!-- ACTION BUTTONS BAR -->
    <div class="actions-bar">
        <button type="button" class="btn-action btn-restart" id="btnRestart" onclick="restartApp()">New Session</button>
        <button type="button" class="btn-action btn-evidence" id="btnEvidence" onclick="downloadEvidence()">📸 Download Evidence</button>
        <button type="button" class="btn-action btn-check" id="btnCheck" onclick="checkAnswers()">Check Answers</button>
    </div>
</div>

<script>
    let selectedQuestionCount = 15;
    let activeInputEl = null;
    let questionsData = [];
    let isChecked = false;
    let studentNameVal = '';

    function selectCount(count, btn) {
        selectedQuestionCount = count;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function startPractice() {
        studentNameVal = document.getElementById('studentName').value.trim();
        const errorEl = document.getElementById('nameError');

        if (!studentNameVal) {
            errorEl.style.display = 'block';
            return;
        }
        errorEl.style.display = 'none';

        document.getElementById('displayName').innerText = studentNameVal;
        document.getElementById('displayModeTag').innerText = `${selectedQuestionCount} Questions Practice`;
        
        document.getElementById('screen-setup').style.display = 'none';
        document.getElementById('screen-quiz').classList.add('active');

        generateQuestions();
    }

    function generateQuestions() {
        const grid = document.getElementById('questionsGrid');
        grid.innerHTML = '';
        questionsData = [];
        isChecked = false;

        for (let i = 0; i < selectedQuestionCount; i++) {
            // Multiplication tables between 2 and 12
            const num1 = Math.floor(Math.random() * 11) + 2; 
            const num2 = Math.floor(Math.random() * 11) + 2; 
            const answer = num1 * num2;

            questionsData.push({ id: i, num1, num2, answer });

            const qCard = document.createElement('div');
            qCard.className = 'q-card';
            qCard.innerHTML = `
                <div>
                    <span class="q-number">#${i + 1}</span>
                    <span class="q-expression">${num1} × ${num2} =</span>
                </div>
                <div class="q-input-wrap">
                    <input type="text" class="q-input" id="input-${i}" 
                           inputmode="none" readonly 
                           onclick="setActiveInput(this)" />
                    <span class="q-mark" id="mark-${i}"></span>
                </div>
            `;
            grid.appendChild(qCard);
        }

        // Auto focus first input cell
        const firstInput = document.getElementById('input-0');
        if (firstInput) setActiveInput(firstInput);
    }

    function setActiveInput(el) {
        if (isChecked) return;
        if (activeInputEl) activeInputEl.classList.remove('active');
        activeInputEl = el;
        activeInputEl.classList.add('active');
    }

    /* On-Screen Touch Numpad Actions */
    function pressNum(digit) {
        if (!activeInputEl || isChecked) return;
        if (activeInputEl.value.length < 4) {
            activeInputEl.value += digit;
        }
    }

    function pressBackspace() {
        if (!activeInputEl || isChecked) return;
        activeInputEl.value = activeInputEl.value.slice(0, -1);
    }

    function focusNextInput() {
        if (!activeInputEl || isChecked) return;
        const currentIdx = parseInt(activeInputEl.id.replace('input-', ''), 10);
        const nextIdx = currentIdx + 1;
        if (nextIdx < selectedQuestionCount) {
            const nextEl = document.getElementById(`input-${nextIdx}`);
            if (nextEl) {
                setActiveInput(nextEl);
                nextEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }
    }

    /* Hardware Keyboard Support */
    document.addEventListener('keydown', (e) => {
        if (!activeInputEl || isChecked) return;
        if (e.key >= '0' && e.key <= '9') {
            pressNum(e.key);
        } else if (e.key === 'Backspace') {
            pressBackspace();
        } else if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            focusNextInput();
        }
    });

    /* Check Answers & Grading Logic */
    function checkAnswers() {
        if (isChecked) return;

        let score = 0;
        questionsData.forEach(q => {
            const inputEl = document.getElementById(`input-${q.id}`);
            const markEl = document.getElementById(`mark-${q.id}`);
            const userVal = parseInt(inputEl.value.trim(), 10);

            if (userVal === q.answer) {
                score++;
                markEl.innerText = '✓';
                markEl.className = 'q-mark tick';
                inputEl.style.borderColor = 'var(--correct-color)';
                inputEl.style.backgroundColor = 'var(--correct-bg)';
            } else {
                markEl.innerText = '✕';
                markEl.className = 'q-mark cross';
                inputEl.style.borderColor = 'var(--incorrect-color)';
                inputEl.style.backgroundColor = 'var(--incorrect-bg)';
            }
        });

        isChecked = true;

        // Display Score Badge
        const badge = document.getElementById('scoreBadge');
        badge.innerText = `Score: ${score} / ${selectedQuestionCount}`;
        badge.classList.add('visible');

        // Personal Feedback Banner
        const feedbackBanner = document.getElementById('feedbackBanner');
        const percentage = (score / selectedQuestionCount) * 100;

        if (score === selectedQuestionCount) {
            // 100% Score
            feedbackBanner.innerText = `🌟 Excellent! You did it, ${studentNameVal}! Come back later to maintain your level.`;
            feedbackBanner.className = 'feedback-banner show perfect';
            badge.style.borderColor = 'var(--correct-color)';
            badge.style.color = 'var(--correct-color)';
        } else if (percentage >= 89.9) {
            // >= 90% Score (e.g. 14/15, 27/30, 45/50)
            feedbackBanner.innerText = `🎉 Way to go, ${studentNameVal}! Good job!`;
            feedbackBanner.className = 'feedback-banner show great';
            badge.style.borderColor = 'var(--primary)';
            badge.style.color = 'var(--primary)';
        } else {
            // < 90% Score
            feedbackBanner.innerText = `💪 Practice makes perfect and reflection makes better, ${studentNameVal}.`;
            feedbackBanner.className = 'feedback-banner show retry';
            badge.style.borderColor = '#c2410c';
            badge.style.color = '#c2410c';
        }

        // Hide Numpad & Reveal Evidence Buttons
        document.getElementById('numpad').style.display = 'none';
        document.getElementById('btnCheck').style.display = 'none';
        document.getElementById('btnEvidence').style.display = 'inline-block';
        document.getElementById('btnRestart').style.display = 'inline-block';

        if (activeInputEl) activeInputEl.classList.remove('active');

        // Scroll capture area into full view
        document.getElementById('capture-area').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* Download Evidence Screenshot */
    function downloadEvidence() {
        const captureTarget = document.getElementById('capture-area');
        const cleanName = studentNameVal.replace(/\s+/g, '_');

        if (typeof html2canvas !== 'undefined') {
            html2canvas(captureTarget, {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true
            }).then(canvas => {
                const image = canvas.toDataURL('image/png');
                triggerDownload(image, `TimesTable_Practice_${cleanName}.png`);
            }).catch(err => {
                console.warn('html2canvas capture error, executing fallback:', err);
                generateFallbackReport(cleanName);
            });
        } else {
            generateFallbackReport(cleanName);
        }
    }

    function triggerDownload(dataUrl, fileName) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    /* Standalone Fallback Canvas Renderer */
    function generateFallbackReport(cleanName) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 900;
        
        const rowCount = Math.ceil(questionsData.length / 3);
        canvas.height = 240 + rowCount * 45;

        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Header
        ctx.fillStyle = '#1d4ed8';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText(`Student: ${studentNameVal}`, 40, 50);

        const scoreText = document.getElementById('scoreBadge').innerText;
        ctx.fillStyle = '#16a34a';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText(scoreText, 680, 50);

        // Feedback Text
        const feedbackText = document.getElementById('feedbackBanner').innerText;
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(feedbackText, 40, 95);

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(40, 120);
        ctx.lineTo(860, 120);
        ctx.stroke();

        // Render Questions Table
        ctx.font = '18px monospace';
        questionsData.forEach((q, idx) => {
            const col = idx % 3;
            const row = Math.floor(idx / 3);
            const x = 40 + col * 280;
            const y = 160 + row * 45;

            const inputEl = document.getElementById(`input-${q.id}`);
            const userVal = inputEl ? inputEl.value : '';
            const isCorrect = parseInt(userVal, 10) === q.answer;

            ctx.fillStyle = isCorrect ? '#16a34a' : '#dc2626';
            const symbol = isCorrect ? '[✓]' : '[✕]';
            ctx.fillText(`${symbol} ${q.num1}x${q.num2} = ${userVal || '?'} (${q.answer})`, x, y);
        });

        const image = canvas.toDataURL('image/png');
        triggerDownload(image, `TimesTable_Practice_${cleanName}.png`);
    }

    function restartApp() {
        location.reload();
    }
</script>

</body>
</html>
